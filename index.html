<title>My Last Duchess · Class XI</title>
<style>
:root{--wall:#e8ede6;--ink:#1d2320;--curtain:#7a1f2b;--bronze:#8a6a2f;--card:#f8faf6;--line:#c9d2c4}
@media(prefers-color-scheme:dark){:root{--wall:#1b211e;--ink:#e6ebe3;--card:#242c28;--line:#3a463f;--bronze:#d2ac62}}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);font:17px/1.7 Georgia,"Noto Serif Bengali","Noto Sans Bengali",serif}
header{background:linear-gradient(90deg,#4f0f19,#7a1f2b 20%,#5c1520 38%,#7a1f2b 60%,#4f0f19 80%,#7a1f2b);color:#f6e9d7;padding:28px 18px 18px;text-align:center}
h1{margin:0;font-size:2rem;letter-spacing:.02em}header p{margin:4px 0 0;opacity:.85;font-size:.95rem}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--curtain);display:flex;gap:4px;overflow-x:auto;padding:6px;align-items:center}
nav button{flex:none;border:0;background:none;color:var(--ink);font:inherit;font-size:.92rem;padding:8px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--curtain);color:#fff}
nav .lang{margin-left:auto;border:1px solid var(--bronze);color:var(--bronze);font-weight:bold}
button:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:16px}

.ln{display:block}.w{cursor:pointer;border-bottom:1px dotted var(--bronze)}.w:hover,.w.sel{background:#d9b86a55}
.mean{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:.93rem}
.bn{font-family:"Noto Sans Bengali","Kalpurush",sans-serif}

h2{color:var(--curtain);margin:22px 0 6px}h3{margin:16px 0 2px;color:var(--bronze)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 14px;margin:10px 0}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--curtain);padding:14px 18px 22px;transform:translateY(110%);transition:transform .2s;z-index:9}

<script>
const L=["That's my last Duchess painted on the wall,","Looking as if she were alive. I call","That piece a wonder, now: Frà Pandolf's hands","Worked busily a day, and there she stands.","Will 't please you sit and look at her? I said","'Frà Pandolf' by design, for never read","Strangers like you that pictured countenance","The depth and passion of its earnest glance,","But to myself they turned (since none puts by","The curtain I have drawn for you, but I)","And seemed as they would ask me, if they durst,","How such a glance came there; so, not the first","Are you to turn and ask thus. Sir, 't was not","Her husband's presence only, called that spot","Of joy into the Duchess' cheek: perhaps","Frà Pandolf chanced to say, 'Her mantle laps","Over my lady's wrist too much,' or 'Paint","Must never hope to reproduce the faint","Half-flush that dies along her throat:' such stuff","Was courtesy, she thought, and cause enough","For calling up that spot of joy. She had","A heart-how shall I say?-too soon made glad,","Too easily impressed; she liked whate'er","She looked on, and her looks went everywhere.","Sir, 't was all one! My favour at her breast,","The dropping of the daylight in the West,","The bough of cherries some officious fool","Broke in the orchard for her, the white mule","She rode with round the terrace-all and each","Would draw from her alike the approving speech,","Or blush, at least. She thanked men,-good! but thanked","Somehow-I know not how-as if she ranked","My gift of a nine-hundred-years-old name","With anybody's gift. Who'd stoop to blame","This sort of trifling? Even had you skill","In speech-(which I have not)-to make your will","Quite clear to such an one, and say, 'Just this","Or that in you disgusts me; here you miss,","Or there exceed the mark'-and if she let","Herself be lessoned so, nor plainly set","Her wits to yours, forsooth, and made excuse,","-E'en then would be some stooping; and I choose","Never to stoop. Oh, sir, she smiled, no doubt,","Whene'er I passed her; but who passed without","Much the same smile? This grew; I gave commands;","Then all smiles stopped together. There she stands","As if alive. Will 't please you rise? We'll meet","The company below then. I repeat,","The Count your master's known munificence","Is ample warrant that no just pretence","Of mine for dowry will be disallowed;","Though his fair daughter's self, as I avowed","At starting, is my object. Nay, we'll go","Together down, sir. Notice Neptune, though,","Taming a sea-horse, thought a rarity,","Which Claus of Innsbruck cast in bronze for me!"];
const SEG=[
[0,3,"That is my late wife's portrait on the wall; she looks alive. I call it a wonder: Fra Pandolf worked busily for a day, and there she stands.","ওই দেয়ালে আঁকা ছবিটাই আমার প্রয়াত স্ত্রী, আগের ডাচেস; দেখলে মনে হয় সে জীবন্ত। আমি একে বিস্ময়কর বলি—ফ্রা প্যান্ডল্ফের হাত একদিন ব্যস্তভাবে কাজ করেছিল, আর সে এখন এখানে দাঁড়িয়ে আছে।"],
[4,9,"Please sit and look. I named 'Fra Pandolf' on purpose: strangers who see that earnest, passionate glance always turn to me, since only I draw the curtain.","দয়া করে বসে দেখুন। আমি ইচ্ছে করেই 'ফ্রা প্যান্ডল্ফ' নামটা বললাম—আপনার মতো অচেনা কেউ ছবির আন্তরিক ও আবেগভরা দৃষ্টি দেখলে আমার দিকেই ফিরে তাকায়, কারণ এই পর্দা আমি ছাড়া কেউ সরায় না।"],
[10,12,"They seem to ask, if they dared, how such a glance came there. You are not the first to ask.","সাহস থাকলে তারা জিজ্ঞেস করত, ওই দৃষ্টি ছবিতে এল কীভাবে। আপনিই প্রথম নন যিনি এমন প্রশ্ন করছেন।"],
[13,20,"It was not only her husband's presence that brought joy to her cheek. The painter might say her mantle covers her wrist too much, or that paint cannot capture the faint blush at her throat; she took such talk as courtesy and blushed.","শুধু স্বামীর উপস্থিতিই তার গালে আনন্দের আভা আনত না। চিত্রকর হয়তো বলতেন, 'আলখাল্লা কব্জি বেশি ঢেকেছে' বা 'গলার হালকা লালিমা রঙে ধরা অসম্ভব'—এসব ফাঁকা কথাকে সে ভদ্রতা ভাবত, তাতেই লাল হয়ে উঠত।"],
[21,23,"She had a heart too quickly made glad and easily impressed; she liked whatever she looked at, and her glances went everywhere.","তার হৃদয় ছিল—কীভাবে বলি—বড্ড তাড়াতাড়ি খুশি হওয়া, সহজে মুগ্ধ হওয়া; যা দেখত তাই ভালো লাগত, দৃষ্টি যেত সর্বত্র।"],
[24,29,"To her all was the same: my jewel at her breast, the sunset, a bough of cherries from a foolish helper, her white mule. Each drew the same approving words or blush.","তার কাছে সবই সমান ছিল: বুকে আমার দেওয়া অলংকার, সূর্যাস্ত, অতি-উৎসাহী বোকার আনা চেরির ডাল, সাদা খচ্চর—সবই তার কাছ থেকে একই প্রশংসা বা লজ্জার আভা আদায় করত।"],
[30,33,"She thanked men, but as if she ranked my nine-hundred-year-old name with anybody's gift.","সে মানুষকে ধন্যবাদ দিত, কিন্তু এমনভাবে যেন আমার নশো বছরের পুরোনো বংশমর্যাদার উপহারকে সে যে কারও উপহারের সমান ধরত।"],
[34,41,"Who would stoop to blame such trifling? Even if I could tell her what displeased me and she accepted it without excuse, that would still be stooping, and I never stoop.","এমন তুচ্ছ ব্যাপারে দোষ দিতে কে নিজেকে নিচু করবে? ধরুন আমি বলতে পারতাম কী আমাকে বিরক্ত করছে, আর সে অজুহাত ছাড়া মেনে নিত—তবু তা নিজেকে নিচু করা হতো; আমি কখনও নিচু হই না।"],
[42,45,"She smiled when I passed, but so she did at everyone. It grew; I gave commands; then all smiles stopped. There she stands, as if alive.","সে হাসত ঠিকই, আমি পাশ দিয়ে গেলে; কিন্তু অন্য সবার প্রতিও একই হাসি। এটা বাড়ল; আমি আদেশ দিলাম; তখন সব হাসি একসঙ্গে থেমে গেল। সে ওখানে দাঁড়িয়ে আছে, যেন জীবন্ত।"],
[46,47,"Please rise; let us join the company below.","দয়া করে উঠুন; নিচে অতিথিদের কাছে যাই।"],
[48,51,"Your master the Count's known generosity assures me that my just claim for a dowry will not be refused, though, as I said at the start, his daughter herself is my object.","আপনার প্রভু কাউন্টের সুপরিচিত বদান্যতা নিশ্চিত করে যে যৌতুকের জন্য আমার ন্যায্য দাবি অগ্রাহ্য হবে না; যদিও শুরুতেই বলেছি, তাঁর সুন্দরী কন্যাই আমার আসল লক্ষ্য।"],
[52,55,"No, let us go down together. Notice Neptune taming a sea-horse, a rarity Claus of Innsbruck cast in bronze for me.","না, একসঙ্গে নিচে যাই। দেখুন নেপচুন সমুদ্রঘোড়া বশ করছেন—এক দুর্লভ শিল্প, ইন্সব্রুকের ক্লাউস আমার জন্য ব্রোঞ্জে ঢেলেছে।"]];

notes:[
["Ferrara","ফেরারা","The Duke of Ferrara, the speaker; the title shows his high rank and wealth.","ফেরারার ডিউক, কবিতার বক্তা; এই নাম তার উচ্চ মর্যাদা ও সম্পদ বোঝায়।"],
["Fra Pandolf","ফ্রা প্যান্ডল্ফ","A (probably fictional) painter named to stress the portrait's value and the Duke's wealth in hiring famous artists.","সম্ভবত কাল্পনিক চিত্রকর; নামটি ছবির মূল্য ও ডিউকের ধনসম্পদ বোঝাতে ব্যবহৃত।"],
["Pictured countenance","চিত্রিত মুখাবয়ব","The Duchess's face in the portrait, lively 'as if she were alive'.","ছবিতে ডাচেসের মুখ, 'যেন জীবন্ত'।"],
["The depth and passion of that earnest glance","আন্তরিক দৃষ্টির গভীরতা ও আবেগ","Her warm personality, which the Duke found troublesome because he wanted her attention for himself alone.","তার উষ্ণ ব্যক্তিত্ব, যা ডিউকের কাছে সমস্যার কারণ—সে চেয়েছিল মনোযোগ শুধু তার প্রতি থাকুক।"],
["Durst","Durst","Dared.","সাহস করত।"],
["Too easily impressed","সহজে মুগ্ধ","The Duke reads her friendliness and openness as disloyalty and frivolity.","ডিউক তার বন্ধুত্বপূর্ণ খোলামেলা স্বভাবকে অবিশ্বস্ততা ও চপলতা ভাবত।"],
["My favour at her breast","বুকে আমার উপহার","Expensive jewels given by the Duke.","ডিউকের দেওয়া দামি গহনা।"],
["Officious","Officious","Eager to please.","অতি-উৎসাহী, খুশি করতে ব্যস্ত।"],
["My gift of a nine-hundred-years-old name","নশো বছরের পুরোনো নামের উপহার","His pride in noble lineage; he resented that she did not value it above everything.","বংশগৌরব নিয়ে অহংকার; সে ক্ষুব্ধ ছিল যে ডাচেস এটিকে সবকিছুর ওপরে মূল্য দেয়নি।"],
["Stoop to blame","দোষ দিতে নিচু হওয়া","He would not lower himself even to criticise her generous nature.","তার উদার স্বভাবের সমালোচনা করতেও সে নিজেকে নিচু করতে রাজি ছিল না।"],
["Forsooth","Forsooth","In fact, in truth.","আসলে, সত্যিই।"],
["I gave commands; then all smiles stopped together","আমি আদেশ দিলাম; তখন সব হাসি একসঙ্গে থেমে গেল","Implies the Duke ordered her death: cruelty and desire for control.","ইঙ্গিত: ডিউক তার মৃত্যুর আদেশ দিয়েছিল—নিষ্ঠুরতা ও নিয়ন্ত্রণ-লিপ্সা।"],
["Munificence","Munificence","Bounty, great generosity.","দানশীলতা, বদান্যতা।"],
["Avowed","Avowed","Declared.","ঘোষণা করেছি।"],
["Neptune","নেপচুন","Roman god of the sea; the Duke sees himself as powerful, taming others to his will.","রোমান সমুদ্রদেবতা; ডিউক নিজেকে ক্ষমতাবান ভাবে, অন্যকে নিজের ইচ্ছায় বশ করে।"],
["Claus of Innsbruck","ইন্সব্রুকের ক্লাউস","An imaginary sculptor; Innsbruck is a town in Austria.","কাল্পনিক ভাস্কর; ইন্সব্রুক অস্ট্রিয়ার একটি শহর।"]],
qa:[
["SAQ 1. What used to bring the 'spot of joy' to the Duchess's cheek? (2)","১. ডাচেসের গালে 'spot of joy' কীসে আসত? (২)","Not only her husband's presence, but also courteous remarks, such as the painter's compliment on her mantle or the faint blush on her throat.","শুধু স্বামীর উপস্থিতি নয়, শিষ্টাচারমূলক প্রশংসাও, যেমন চিত্রকরের আলখাল্লা বা গলার হালকা লালিমা নিয়ে মন্তব্য।"],
["SAQ 2. What does the 'rarity' (Neptune taming a sea-horse) symbolically suggest? (2)","২. 'rarity' (সমুদ্রঘোড়া বশ করা নেপচুন) প্রতীকীভাবে কী বোঝায়? (২)","The Duke's love of dominance: he 'tamed' the Duchess as Neptune tames the sea-horse, and he collects rare things, including people.","ডিউকের আধিপত্যপ্রিয়তা: নেপচুন যেমন সমুদ্রঘোড়া বশ করে, তেমনি সে ডাচেসকে 'বশ' করেছে; সে দুর্লভ বস্তুর মতো মানুষও সংগ্রহ করে।"],
["Q3. Why was the person spoken to sent by his master? What is the master's munificence ample warrant of? What is the Duke's principal object? (2+2+2)","৩. শ্রোতাকে তাঁর প্রভু কেন পাঠিয়েছেন? প্রভুর বদান্যতা কীসের নিশ্চয়তা? ডিউকের মূল লক্ষ্য কী? (২+২+২)","The Count sent the envoy to arrange the Duke's marriage with his daughter. His known generosity is ample warrant that the Duke's just claim for a dowry will not be refused. The Duke says his principal object is the daughter herself, though the dowry talk suggests otherwise.","কাউন্ট দূতকে পাঠিয়েছেন তাঁর কন্যার সঙ্গে ডিউকের বিয়ের কথা চালাতে। তাঁর সুপরিচিত বদান্যতা নিশ্চিত করে যে যৌতুকের ন্যায্য দাবি অগ্রাহ্য হবে না। ডিউকের মতে মূল লক্ষ্য কন্যা নিজে, যদিও যৌতুকের প্রসঙ্গ অন্য ইঙ্গিত দেয়।"],
["Q4. 'This grew, I gave commands and all smiles stopped together'—what character of the Duke is revealed? (6)","৪. 'This grew, I gave commands and all smiles stopped together'—এখানে ডিউকের কোন চরিত্র প্রকাশ পায়? (৬)","It reveals a cruel, jealous, proud and controlling man. He could not bear her equal kindness to all, would not 'stoop' to talk to her, and chose silence and a murderous order. He speaks of it calmly, which shows lack of remorse and a view of his wife as property.","এতে ডিউকের নিষ্ঠুর, ঈর্ষাপরায়ণ, অহংকারী ও নিয়ন্ত্রণকামী চরিত্র ফোটে। সবার প্রতি ডাচেসের সমান সদয়তা সে সইতে পারেনি, তার সঙ্গে কথা বলে 'নিচু' হতে চায়নি, বরং হত্যার আদেশ বেছে নিয়েছে। শান্তভাবে বলার মধ্যে অনুশোচনাহীনতা ও স্ত্রীকে সম্পত্তি ভাবার মনোভাব প্রকাশ পায়।"],
["Broad Q5. Why is 'My Last Duchess' called a dramatic monologue?","বিস্তারিত ৫. 'My Last Duchess'-কে নাট্যস্বগতোক্তি বলা হয় কেন?","One speaker (the Duke) addresses a silent listener in a specific setting, and his speech unintentionally reveals his character; the envoy's reactions are only implied.","একজন বক্তা (ডিউক) নির্দিষ্ট স্থানে নীরব শ্রোতাকে সম্বোধন করে এবং নিজের কথায় অজান্তে চরিত্র প্রকাশ করে; দূতের প্রতিক্রিয়া শুধু ইঙ্গিতে থাকে।"],
["Broad Q6. Discuss the significance of the title and the ending.","বিস্তারিত ৬. শিরোনাম ও সমাপ্তির তাৎপর্য আলোচনা করো।","'Last' means both 'most recent' and 'final', hinting that a new duchess is next. The ending moves from the murder to a bronze statue of Neptune, showing the Duke ready to repeat the pattern.","'Last' শব্দের অর্থ 'সর্বশেষ' ও 'আগের', ইঙ্গিত: নতুন ডাচেস আসছে। শেষে খুন থেকে নেপচুনের ব্রোঞ্জ মূর্তিতে সরে এসে বোঝানো হয় ডিউক একই ধারা পুনরাবৃত্তি করতে প্রস্তুত।"]]};
let tab="poem",mode="both",showM=true;
const $=s=>document.querySelector(s);
const T=(o)=>mode=="en"?o[0]:mode=="bn"?o[1]:o[0]+" / "+o[1];
const B=(e,b)=>mode=="en"?`<div>${e}</div>`:mode=="bn"?`<div class=bn>${b}</div>`:`<div>${e}</div><div class=bn>${b}</div>`;
function nav(){$("#nav").innerHTML=Object.keys(TABS).map(k=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';draw()">${T(TABS[k])}</button>`).join("")+`<button class=lang onclick="mode=mode=='both'?'en':mode=='en'?'bn':'both';draw()">${mode=="both"?"EN+বাং":mode=="en"?"EN":"বাং"}</button>`;$("#ttl").textContent=mode=="en"?"My Last Duchess":mode=="bn"?"মাই লাস্ট ডাচেস":"My Last Duchess · মাই লাস্ট ডাচেস";$("#sub").textContent=T(["Robert Browning · A Realm of English (B) · Class XI","রবার্ট ব্রাউনিং · এ রিয়েলম অফ ইংলিশ (বি) · একাদশ শ্রেণি"]);document.documentElement.lang=mode=="bn"?"bn":"en"}
function word(w){return w.replace(/[^A-Za-zà-ÿ'’-]/g,"").replace(/^['’-]+|['’-]+$/g,"").toLowerCase()}
function look(w){let k=word(w);return D[k]||D[k.replace(/'s$/,"")]||D[k.replace(/s$/,"")]||null}
function lookE(w){let k=word(w);return E[k]||E[k.replace(/'s$/,"")]||E[k.replace(/s$/,"")]||null}
function pop(w){const e=lookE(w)||"a simple word (see the sentence meaning)",b=look(w)||"সাধারণ শব্দ—বাক্যের অর্থ দেখুন।";return mode=="en"?`<div>${e}</div>`:mode=="bn"?`<div class=bn>${b}</div>`:`<div>${e}</div><div class=bn>${b}</div>`}
function show(el,w){document.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");const m=look(w);$("#sheet").innerHTML=`<b>${word(w)}</b>${pop(w)}<button onclick="document.getElementById('sheet').classList.remove('open')">✕</button>`;$("#sheet").classList.add("open")}
function poem(){let h=`<div class=tools><label><input type=checkbox ${showM?"checked":""} onchange="showM=this.checked;draw()"> ${T(["Sentence meanings","বাক্যের অর্থ"])}</label></div><p>${T(["Tap any word for its Bengali meaning.","যেকোনো শব্দে চাপ দিলে বাংলা অর্থ দেখা যাবে।"])}</p>`;
SEG.forEach(s=>{h+=`<div class=seg>`+L.slice(s[0],s[1]+1).map(l=>`<span class=ln>`+l.split(" ").map(tok=>(D[word(tok)]?[tok]:tok.split(/(?<=[^-])-(?=[^-])/)).map(w=>`<span class=w onclick="show(this,'${w.replace(/'/g,"\\'")}')">${w}</span>`).join("-")).join(" ")+`</span>`).join("")+(showM?`<div class=mean>${B(s[2],s[3])}</div>`:"")+`</div>`});return h}
function list(k){return CONTENT[k].map(c=>mode=="en"?`<h3>${c[0]}</h3><div class=card>${c[2]}</div>`:mode=="bn"?`<h3 class=bn>${c[1]}</h3><div class="card bn">${c[3]}</div>`:`<h3>${c[0]} / <span class=bn>${c[1]}</span></h3><div class=card>${c[2]}<hr><div class=bn>${c[3]}</div></div>`).join("")}
function qa(){return CONTENT.qa.map(c=>`<div class=card><h3>${T([c[0],c[1]])}</h3>${B(c[2],c[3])}</div>`).join("")}
function draw(){nav();document.getElementById("sheet").classList.remove("open");$("#app").innerHTML=`<h2>${T(TABS[tab])}</h2>`+(tab=="poem"?poem():tab=="qa"?qa():list(tab));scrollTo(0,0)}
draw();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
