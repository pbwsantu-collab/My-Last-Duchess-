<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7a1f2b">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>My Last Duchess · Class XI</title>
<style>
:root{--wall:#e8ede6;--ink:#1d2320;--curtain:#7a1f2b;--bronze:#8a6a2f;--card:#f8faf6;--line:#c9d2c4}
@media(prefers-color-scheme:dark){:root{--wall:#1b211e;--ink:#e6ebe3;--card:#242c28;--line:#3a463f;--bronze:#d2ac62}}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);font:17px/1.7 Georgia,"Noto Serif Bengali","Noto Sans Bengali",serif}
header{background:linear-gradient(90deg,#4f0f19,#7a1f2b 20%,#5c1520 38%,#7a1f2b 60%,#4f0f19 80%,#7a1f2b);color:#f6e9d7;padding:28px 18px 18px;text-align:center}
h1{margin:0;font-size:2rem;letter-spacing:.02em}header p{margin:4px 0 0;opacity:.85;font-size:.95rem}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--curtain);display:flex;gap:4px;overflow-x:auto;padding:6px;align-items:center}
nav button{flex:none;border:0;background:none;color:var(--ink);font:inherit;font-size:.92rem;padding:8px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--curtain);color:#fff}
nav .lang{margin-left:auto;border:1px solid var(--bronze);color:var(--bronze);font-weight:bold}
button:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:16px}
.seg{background:var(--card);border-left:4px solid var(--curtain);padding:10px 14px;margin:14px 0;border-radius:4px}
.ln{display:block}.w{cursor:pointer;border-bottom:1px dotted var(--bronze)}.w:hover,.w.sel{background:#d9b86a55}
.mean{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:.93rem}
.bn{font-family:"Noto Sans Bengali","Kalpurush",sans-serif}
.tools{display:flex;gap:10px;align-items:center;font-size:.9rem}
h2{color:var(--curtain);margin:22px 0 6px}h3{margin:16px 0 2px;color:var(--bronze)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 14px;margin:10px 0}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--curtain);padding:14px 18px 22px;transform:translateY(110%);transition:transform .2s;z-index:9}
#sheet.open{transform:none}#sheet b{font-size:1.2rem;color:var(--curtain)}
@media(prefers-reduced-motion:reduce){#sheet{transition:none}}
.voice-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 6px}
.voice-bar button{border:1px solid var(--curtain);background:var(--card);color:var(--curtain);font:inherit;font-size:.9rem;padding:6px 12px;border-radius:6px;cursor:pointer}
.voice-bar button:hover{background:var(--curtain);color:#fff}
.voice-bar button.active{background:var(--curtain);color:#fff}
.voice-bar select{font:inherit;font-size:.85rem;padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.ln.speaking{background:#d9b86a44;border-radius:3px;transition:background .15s}
.seg.speaking{box-shadow:0 0 0 2px var(--bronze)}
</style></head><body>
<header><h1 id="ttl"></h1><p id="sub"></p></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="sheet" role="dialog" aria-live="polite"></div>

</script></body></html>
